<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GNT Stock Manager - Inventory Management Dashboard">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GNT Stock Manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GNT Stock Manager</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading screen styles */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
      font-family: 'Roboto', sans-serif;
    }
    .loading-content {
      text-align: center;
    }
    .loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #2196F3;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      color: #666;
      font-size: 16px;
    }
  </style>
</head>
<body>
<!-- Loading indicator -->
<div class="loading" id="loading">
  <div class="loading-content">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading GNT Stock Manager...</div>
  </div>
</div>

<!-- Firebase SDKs - Using compat version for web -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<!-- Firebase Configuration -->
<script>
  // Your Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDx0L8uZIHDOMaEXeAhrHUmgzETj1SijEQ",
    authDomain: "stock-manager-510eb.firebaseapp.com",
    projectId: "stock-manager-510eb",
    storageBucket: "stock-manager-510eb.firebasestorage.app",
    messagingSenderId: "164217598709",
    appId: "1:164217598709:web:a47b880a1ca5a322fb0bbc"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  console.log('✅ Firebase initialized successfully');
</script>

<script>
  // Service worker version - injected by Flutter build
  var serviceWorkerVersion = null;
</script>

<!-- This script adds the flutter initialization JS code -->
<script src="flutter.js" defer></script>

<script>
  window.addEventListener('load', function(ev) {
    // Hide loading screen when Flutter is ready
    _flutter.loader.loadEntrypoint({
      serviceWorker: {
        serviceWorkerVersion: serviceWorkerVersion,
      },
      onEntrypointLoaded: function(engineInitializer) {
        engineInitializer.initializeEngine().then(function(appRunner) {
          // Remove loading screen
          document.getElementById('loading').style.display = 'none';
          appRunner.runApp();
        });
      }
    });
  });
</script>
</body>
</html>
